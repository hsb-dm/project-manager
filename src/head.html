<style>

  --color-success:#16A34A; --color-warning:#F59E0B; --color-danger:#EF4444; --color-info:#2F5BFF;

  --r:1; --radius-sm:calc(10px*var(--r)); --radius:calc(14px*var(--r)); --radius-lg:calc(20px*var(--r)); --radius-xl:calc(26px*var(--r)); --pill:999px;
  --font-ui:"Poppins","Inter",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif; --font-mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  /* One shared horizontal rhythm for every screen and the top navigation. */
  --topbar-h:64px; --page-gutter:32px; --gutter:var(--page-gutter); --sp-1:6px; --sp-2:10px; --sp-3:14px; --sp-4:18px; --sp-5:24px; --row-py:11px; --fs-sm:12.5px; --fs-base:13.5px; --fs-md:14.5px;
  /* team palette (§8) */

}
[data-density="compact"]{--sp-1:4px;--sp-2:7px;--sp-3:10px;--sp-4:13px;--sp-5:16px;--row-py:7px;--fs-sm:12px;--fs-base:13px;--fs-md:13.5px;--topbar-h:56px}
[data-radius="sharp"]{--r:0.3}[data-radius="medium"]{--r:0.7}[data-radius="round"]{--r:1}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-ui);font-size:var(--fs-base);color:var(--color-text-primary);background:var(--color-background);-webkit-font-smoothing:antialiased;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.num,.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

.errbox,.banner{align-items:center}

/* ---------- shell: topbar with pill nav (reference style) ---------- */
.topbar{height:var(--topbar-h);background:var(--color-surface);border-bottom:1px solid var(--color-border);position:sticky;top:0;z-index:40}
.topbar-inner{height:100%;display:flex;align-items:center;gap:14px;max-width:1560px;width:100%;margin:0 auto;padding:0 var(--gutter)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;flex:0 1 auto;max-width:190px}
.ws-logo{width:34px;height:34px;border-radius:11px;background:var(--color-primary);color:var(--color-primary-ink);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:-.02em;flex:none;overflow:hidden}.ws-logo img{width:100%;height:100%;object-fit:cover}

.pillsel-custom:has(select)::after{display:none}
select{appearance:none;-webkit-appearance:none;box-sizing:border-box;color:var(--color-text-primary);color-scheme:light dark;background-color:var(--color-surface)!important;background-image:linear-gradient(45deg,transparent 50%,var(--color-text-secondary) 50%),linear-gradient(135deg,var(--color-text-secondary) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px!important}
select option{background:var(--color-surface);color:var(--color-text-primary)}
select:focus{border-color:var(--color-primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--color-primary) 18%,transparent)}
.pillsel select{background-image:none!important;padding-right:16px!important;box-shadow:none!important}
.pillsel.on{border-color:var(--color-primary);background:var(--color-primary-soft)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar input[type=text]{border:1px solid var(--color-border);border-radius:var(--pill);padding:6px 12px;background:var(--color-surface);font-size:var(--fs-sm);outline:none}.toolbar input:focus{border-color:var(--color-primary)}

.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}

.pagehead h1[contenteditable]{outline:none;border-radius:8px}.pagehead h1[contenteditable]:focus{box-shadow:0 0 0 3px var(--color-primary-soft)}

/* ---------- cards ---------- */
.grid{display:grid;gap:var(--sp-4)}.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g-1-2{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}.g-1-1-1{grid-template-columns:repeat(3,minmax(0,1fr))}.g-1-1{grid-template-columns:repeat(2,minmax(0,1fr))}.g-3-2{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
@media (max-width:1180px){.g-2-1,.g-1-2,.g-1-1-1,.g-1-1,.g-3-2{grid-template-columns:1fr}}
.panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);display:flex;flex-direction:column;min-width:0}
.panel.ink{background:var(--color-ink);color:var(--color-ink-text);border-color:var(--color-ink)}.panel.ink .muted,.panel.ink .hint{color:color-mix(in srgb,var(--color-ink-text) 65%,transparent)}.panel.ink .cnt{background:color-mix(in srgb,var(--color-ink-text) 14%,transparent);color:var(--color-ink-text)}.panel.ink .panel-head{border-color:color-mix(in srgb,var(--color-ink-text) 14%,transparent)}
.panel-head{display:flex;align-items:center;gap:10px;padding:var(--sp-3) var(--sp-4);flex-wrap:wrap}

.panel-head .link{font-size:var(--fs-sm);color:var(--color-text-secondary);font-weight:600;cursor:pointer;border:1px solid var(--color-border);border-radius:var(--pill);padding:4px 10px}.panel-head .link:hover{color:var(--color-text-primary)}
.panel.ink .link{border-color:color-mix(in srgb,var(--color-ink-text) 25%,transparent);color:var(--color-ink-text)}.panel.ink .panel-head .cnt{background:var(--color-danger);color:#fff;font-weight:700}
.sq{width:36px;height:36px;border-radius:12px;background:var(--color-surface-sunken);display:grid;place-items:center;color:var(--color-text-primary);flex:none}.sq svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sq.blue{background:var(--color-primary);color:var(--color-primary-ink)}.sq.lime{background:var(--color-secondary);color:#111}.sq.green{background:var(--color-success);color:#fff}.sq.red{background:var(--color-danger);color:#fff}.sq.ink{background:var(--color-ink);color:var(--color-ink-text)}
.panel.ink .sq{background:color-mix(in srgb,var(--color-ink-text) 14%,transparent);color:var(--color-ink-text)}.panel.ink .panel-head .cnt{background:var(--color-danger);color:#fff}
[data-theme="dark"] .panel.ink .empty .h{color:#111214}
[data-theme="dark"] .panel.ink{background:#DDE7FF;color:#111214;border-color:#DDE7FF}[data-theme="dark"] .panel.ink .muted,[data-theme="dark"] .panel.ink .hint,[data-theme="dark"] .panel.ink .row .m,[data-theme="dark"] .panel.ink .row .m .sep,[data-theme="dark"] .panel.ink .due,[data-theme="dark"] .panel.ink .empty{color:#3B4252}[data-theme="dark"] .panel.ink .row{border-color:rgba(17,18,20,.12)}[data-theme="dark"] .panel.ink .row:hover{background:rgba(17,18,20,.05)}[data-theme="dark"] .panel.ink .sq{background:#2F5BFF;color:#fff}[data-theme="dark"] .panel.ink .link{border-color:rgba(17,18,20,.25);color:#111214}[data-theme="dark"] .panel.ink .tbadge{background:#fff;color:#111214;border-color:rgba(0,0,0,.1)}[data-theme="dark"] .panel.ink .badge{background:#fff;color:#111214}[data-theme="dark"] .panel.ink .row .t{color:#111214}[data-theme="dark"] .panel.ink .panel-head .cnt{background:var(--color-danger);color:#fff}[data-theme="dark"] .panel.ink .due.over{color:#B91C1C}[data-theme="dark"] .panel.ink .due.today{color:#B45309}
/* Dense labels and attachment counters sit on dark pills: retain contrast in every dark surface. */
[data-theme="dark"] .panel:not(.ink) .lbl{background:color-mix(in srgb,var(--lc) 42%,#12151D);color:#fff;border-color:color-mix(in srgb,var(--lc) 72%,#fff)}[data-theme="dark"] .panel:not(.ink) .acount{background:color-mix(in srgb,var(--color-primary) 38%,#12151D);color:#fff;border:1px solid color-mix(in srgb,var(--color-primary) 62%,transparent)}[data-theme="dark"] .panel:not(.ink) .tbadge{color:#fff;border-color:color-mix(in srgb,var(--tc) 55%,var(--color-border));background:color-mix(in srgb,var(--tc) 25%,#12151D)}
[data-theme="dark"] .lbl{background:color-mix(in srgb,var(--lc) 42%,#12151D);color:#fff;border-color:color-mix(in srgb,var(--lc) 72%,#fff)}[data-theme="dark"] .acount{background:color-mix(in srgb,var(--color-primary) 38%,#12151D);color:#fff;border:1px solid color-mix(in srgb,var(--color-primary) 62%,transparent)}[data-theme="dark"] .kcard .lbl,[data-theme="dark"] .chip .lbl{color:#fff}[data-theme="dark"] .panel.ink .lbl,[data-theme="dark"] .panel.ink .acount{color:#fff;background:#172342;border-color:#20386C}
.panel-body{padding:0 0 var(--sp-1)}.panel-body.pad{padding:0 var(--sp-4) var(--sp-4)}.panel-foot{padding:var(--sp-2) var(--sp-4) var(--sp-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--sp-3)}.kpis-4{grid-template-columns:repeat(4,minmax(0,1fr))}@media (max-width:900px){.kpis-4{grid-template-columns:repeat(2,1fr)}}

.cal-week{display:grid;grid-template-columns:repeat(7,1fr);min-height:420px}.cal-week .cal-day{min-height:420px}.cal-dayv{display:flex;flex-direction:column;gap:6px;padding:14px;min-height:300px}.cal-dayv .chip{font-size:13px;padding:10px 12px;border-radius:10px}
