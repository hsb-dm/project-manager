# v38.1 release pipeline (docs/ARCHITECTURE-REVIEW-v38.md, P1).
# Every push and pull request: server tests, build check, and the eight browser flows.
# A tag v* additionally produces the release zip that deploy/update.sh installs.
name: ci
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.22", cache: npm }
      - run: npm ci
      - name: Server and integration tests
        run: npm test
      - name: Build is committed and identical
        run: |
          node build.js
          cmp public/index.html dist/creative-os-standalone.html
          git diff --exit-code -- public/index.html dist/creative-os-standalone.html || (echo "::error::Run npm run build and commit public/ and dist/"; exit 1)
      - name: Browser flows (Playwright, Chromium)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: "e2e/report\ne2e/results", retention-days: 14 }
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package (no data, no secrets, no dev tooling)
        run: zip -qr "zencrevia-${GITHUB_REF_NAME}.zip" . -x ".git/*" "node_modules/*" "e2e/results/*" "e2e/report/*" "data/*" ".env"
      - uses: softprops/action-gh-release@v2
        with: { files: "zencrevia-*.zip" }
