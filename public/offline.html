<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZenCrevia — offline</title>
<style>
  :root{--bg:#EEF0F4;--card:#FFFFFF;--ink:#14161B;--muted:#5A6170;--blue:#2F5BFF}
  @media (prefers-color-scheme:dark){:root{--bg:#0F1115;--card:#171A21;--ink:#F3F4F6;--muted:#A3A9B6}}
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;box-sizing:border-box}
  .card{max-width:360px;width:100%;background:var(--card);border-radius:18px;padding:28px 24px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.08)}
  img{width:56px;height:56px;border-radius:14px}
  h1{font-size:18px;margin:14px 0 6px}
  p{margin:0 0 4px;color:var(--muted)}
  button{margin-top:16px;border:0;border-radius:999px;background:var(--blue);color:#fff;font:600 14px/1 inherit;padding:11px 20px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <img src="/pwa-icon/192.png" alt="">
  <h1>You're offline · Kamu sedang offline</h1>
  <p>ZenCrevia needs a connection to show your work.</p>
  <p>ZenCrevia butuh koneksi untuk menampilkan pekerjaanmu.</p>
  <button onclick="location.reload()">Try again · Coba lagi</button>
</div>
</body>
</html>
