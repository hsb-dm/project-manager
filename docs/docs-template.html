<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dokumentasi ZenCrevia</title>
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --sunken:#f1f2f5;
  --text:#14171c; --text2:#525a66; --text3:#79828f;
  --line:#e2e5ea; --line2:#cdd2da;
  --accent:#2f5bea; --accent-soft:#eaefff;
  --ok:#16a34a; --warn:#c77a06; --code-bg:#f4f5f8;
  --sidebar:300px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d0f13; --surface:#14171c; --sunken:#1a1e25;
    --text:#e8eaee; --text2:#a3acb9; --text3:#79828f;
    --line:#252a33; --line2:#333a45;
    --accent:#7d9cff; --accent-soft:#1b2438;
    --ok:#3fbf74; --warn:#e0a03a; --code-bg:#1a1e25;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- layout ---------- */
.wrap{display:flex; align-items:flex-start; max-width:1500px; margin:0 auto}
aside{
  position:sticky; top:0; flex:none; width:var(--sidebar); height:100dvh;
  overflow-y:auto; overscroll-behavior:contain;
  border-right:1px solid var(--line); background:var(--surface); padding:26px 0 40px;
}
main{flex:1; min-width:0; padding:44px 56px 120px; max-width:1000px}

.brand{padding:0 22px 20px; border-bottom:1px solid var(--line); margin-bottom:16px}
.brand b{display:block; font-size:17px; letter-spacing:-.01em}
.brand span{display:block; color:var(--text3); font-size:12px; margin-top:3px}

.filter{padding:0 22px 14px}
.filter input{
  width:100%; padding:8px 11px; border:1px solid var(--line2); border-radius:8px;
  background:var(--bg); color:var(--text); font:inherit; font-size:13px;
}
.filter input:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent}

.navgroup{margin-bottom:6px}
.navtop{
  display:block; padding:10px 22px 8px; font-weight:700; font-size:13.5px; color:var(--text);
  letter-spacing:-.005em;
}
.navtop span{display:block; font-weight:500; font-size:11.5px; color:var(--text3); margin-top:1px}
.navtop:hover{text-decoration:none; color:var(--accent)}
.navgroup ul{list-style:none; margin:0 0 14px; padding:0}
.navgroup li a{
  display:block; padding:5px 22px 5px 30px; font-size:12.8px; color:var(--text2);
  border-left:2px solid transparent;
}
.navgroup li a:hover{color:var(--text); background:var(--sunken); text-decoration:none}
.navgroup li a.on{color:var(--accent); border-left-color:var(--accent); background:var(--accent-soft)}
.navgroup.hide{display:none}
.navgroup li.hide{display:none}

/* ---------- content ---------- */
.doc{padding-bottom:60px}
.doc + .doc{border-top:1px solid var(--line); padding-top:56px}
h1{font-size:34px; line-height:1.2; letter-spacing:-.022em; margin:0 0 20px}
h2{font-size:24px; line-height:1.28; letter-spacing:-.016em; margin:52px 0 14px;
   padding-top:14px; border-top:1px solid var(--line)}
.doc > h2:first-of-type{border-top:0; padding-top:0}
h3{font-size:18px; letter-spacing:-.01em; margin:32px 0 10px}
h4{font-size:15.5px; margin:24px 0 8px; color:var(--text2)}
p{margin:0 0 13px}
ul,ol{margin:0 0 14px; padding-left:24px}
li{margin:4px 0}
li.task{list-style:none; margin-left:-20px; display:flex; gap:9px; align-items:flex-start}
.cb{flex:none; width:15px; height:15px; margin-top:4px; border:1.5px solid var(--line2);
    border-radius:4px; background:var(--surface)}
.cb.on{background:var(--ok); border-color:var(--ok)}
hr{border:0; border-top:1px solid var(--line); margin:34px 0}

code{
  font:12.6px/1.5 ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  background:var(--code-bg); padding:1px 5px; border-radius:5px;
  border:1px solid var(--line);
  /* a long identifier must wrap rather than push the page sideways on a phone */
  white-space:normal; overflow-wrap:anywhere;
}
pre.code{
  background:var(--code-bg); border:1px solid var(--line); border-radius:10px;
  padding:14px 16px; overflow-x:auto; margin:0 0 16px;
}
pre.code code{background:none; border:0; padding:0; white-space:pre; font-size:12.6px; line-height:1.6}

blockquote{
  margin:0 0 16px; padding:13px 18px; background:var(--accent-soft);
  border-left:3px solid var(--accent); border-radius:0 8px 8px 0;
}
blockquote p:last-child{margin-bottom:0}
blockquote code{background:var(--surface)}

.tw{overflow-x:auto; margin:0 0 18px; border:1px solid var(--line); border-radius:10px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:13.4px}
th,td{padding:9px 13px; text-align:left; vertical-align:top; border-bottom:1px solid var(--line)}
th{background:var(--sunken); font-weight:700; font-size:12px; letter-spacing:.02em;
   text-transform:uppercase; color:var(--text2); white-space:nowrap}
tbody tr:last-child td{border-bottom:0}

/* ---------- responsive ---------- */
.menubtn{display:none}
@media (max-width:1080px){
  main{padding:32px 28px 100px}
  aside{width:250px}
}
@media (max-width:820px){
  .wrap{display:block}
  aside{
    position:static; width:auto; height:auto; border-right:0;
    border-bottom:1px solid var(--line); padding:18px 0 10px;
  }
  aside .navgroup ul{display:none}
  aside.open .navgroup ul{display:block}
  .menubtn{
    display:block; margin:0 22px 12px; padding:8px 12px; width:calc(100% - 44px);
    border:1px solid var(--line2); border-radius:8px; background:var(--bg);
    color:var(--text); font:inherit; font-size:13px; font-weight:650; cursor:pointer; text-align:left;
  }
  main{padding:26px 18px 80px}
  h1{font-size:27px}
  h2{font-size:21px}
}

/* ---------- print ---------- */
@media print{
  :root{--bg:#fff; --surface:#fff; --sunken:#f4f5f7; --text:#111; --text2:#444; --line:#ccc}
  aside,.menubtn,.filter{display:none!important}
  .wrap{display:block; max-width:none}
  main{padding:0; max-width:none}
  body{font-size:10.5pt; line-height:1.5}
  h1{font-size:21pt; page-break-after:avoid}
  h2{font-size:15pt; page-break-after:avoid; page-break-before:auto}
  h3,h4{page-break-after:avoid}
  .doc{page-break-before:always; padding-bottom:0}
  .doc:first-child{page-break-before:avoid}
  table,pre.code,blockquote,.tw{page-break-inside:avoid}
  tr{page-break-inside:avoid}
  a{color:inherit; text-decoration:none}
  code,pre.code{background:#f4f5f7}
  @page{margin:16mm 14mm}
}
</style>
</head>
<body>
<div class="wrap">
  <aside id="side">
    <div class="brand"><b>Dokumentasi ZenCrevia</b><span>versi {{VERSION}}</span></div>
    <button class="menubtn" id="menubtn" type="button">Daftar isi</button>
    <div class="filter"><input id="q" type="search" placeholder="Cari bagian…" aria-label="Cari bagian"></div>
    <nav id="nav">{{NAV}}</nav>
  </aside>
  <main>{{MAIN}}</main>
</div>
<script>
(function(){
  var nav = document.getElementById('nav');
  var links = [].slice.call(nav.querySelectorAll('li a'));
  var side = document.getElementById('side');

  document.getElementById('menubtn').onclick = function(){ side.classList.toggle('open'); };

  /* highlight the section currently on screen */
  var targets = links.map(function(a){ return document.getElementById(a.getAttribute('href').slice(1)); });
  function sync(){
    var best = 0, bestTop = -Infinity;
    for (var i = 0; i < targets.length; i++){
      if (!targets[i]) continue;
      var t = targets[i].getBoundingClientRect().top;
      if (t < 120 && t > bestTop){ bestTop = t; best = i; }
    }
    links.forEach(function(a, i){ a.classList.toggle('on', i === best); });
  }
  var tick = false;
  addEventListener('scroll', function(){
    if (tick) return; tick = true;
    requestAnimationFrame(function(){ sync(); tick = false; });
  }, {passive:true});
  sync();

  /* keep the active entry in view inside a long sidebar */
  var lastOn = null;
  var keepInView = setInterval(function(){
    var on = nav.querySelector('a.on');
    if (!on || on === lastOn) return;
    lastOn = on;
    if (innerWidth <= 820) return;
    var r = on.getBoundingClientRect(), s = side.getBoundingClientRect();
    if (r.top < s.top + 8 || r.bottom > s.bottom - 8) on.scrollIntoView({block:'center'});
  }, 250);

  /* filter the table of contents */
  document.getElementById('q').oninput = function(){
    var q = this.value.trim().toLowerCase();
    nav.querySelectorAll('.navgroup').forEach(function(g){
      var any = false;
      g.querySelectorAll('li').forEach(function(li){
        var hit = !q || li.textContent.toLowerCase().indexOf(q) >= 0;
        li.classList.toggle('hide', !hit);
        if (hit) any = true;
      });
      g.classList.toggle('hide', !!q && !any);
    });
  };
})();
</script>
</body>
</html>
