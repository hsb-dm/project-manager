name: zencrevia

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: zencrevia:1.15.0
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      COS_DATA_DIR: /app/data
      COS_BACKUP_DIR: /app/data/backups
      TZ: ${TZ:-Asia/Jakarta}
    # Match the host owner of ./data. This prevents SQLite permission errors
    # when the application runs as the unprivileged Node.js user.
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - type: bind
        source: ${COS_DATA_HOST_PATH:-./data}
        target: /app/data
    ports:
      # cloudflared runs on the VPS host and connects to this loopback-only port.
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-6969}:3000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
